services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: warehouse, POSTGRES_PASSWORD: warehouse, POSTGRES_DB: medipulse}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U warehouse -d medipulse"], interval: 5s, retries: 10}

  app:                      # run the CLI without installing Python locally
    profiles: [tools]
    build: .
    environment: {MEDIPULSE_DB_URL: "postgresql://warehouse:warehouse@postgres:5432/medipulse"}
    depends_on: {postgres: {condition: service_healthy}}
    volumes: ["./docs:/app/docs"]

  metabase:
    profiles: [bi]
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    depends_on: {postgres: {condition: service_healthy}}
    volumes: [mbdata:/metabase-data]
    environment: {MB_DB_FILE: /metabase-data/metabase.db}

volumes: {pgdata: {}, mbdata: {}}
